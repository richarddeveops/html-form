<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../lesson.css">
        <link rel="stylesheet" href="../theme.css">
        <title>HTML Forms</title>
</head>
<body>
        <p><a href="../index.html">All lessons</a></p>
        <header>
                <h1>HTML Forms</h1>
                <p>Use labels and input types to collect information clearly.</p>
        </header>
        <main>
                <p>This lesson form is an example only. It will not send or store your information.</p>
                <form id="signup-form" data-demo-form method="post">
                        <p class="form-field">
                                <label for="first-name">First name</label>
                                <input type="text" id="first-name" name="first-name" autocomplete="given-name" required>
                        </p>
                        <p class="form-field">
                                <label for="last-name">Last name</label>
                                <input type="text" id="last-name" name="last-name" autocomplete="family-name" required>
                        </p>
                        <p class="form-field">
                                <label for="date-of-birth">Date of birth</label>
                                <input type="date" id="date-of-birth" name="date-of-birth">
                        </p>
                        <p class="form-field">
                                <label for="email">Email address</label>
                                <input type="email" id="email" name="email" autocomplete="email" required>
                        </p>
                        <p class="form-field">
                                <label for="gender">Gender</label>
                                <select id="gender" name="gender">
                                        <option value="">Choose an option</option>
                                        <option value="female">Female</option>
                                        <option value="male">Male</option>
                                        <option value="prefer-not-to-say">Prefer not to say</option>
                                </select>
                        </p>
                        <p class="form-field">
                                <label for="state">State of origin</label>
                                <select id="state" name="state">
                                        <option value="">Choose a state</option>
                                        <option value="oyo">Oyo</option>
                                        <option value="lagos">Lagos</option>
                                        <option value="osun">Osun</option>
                                        <option value="ogun">Ogun</option>
                                        <option value="ondo">Ondo</option>
                                        <option value="ekiti">Ekiti</option>
                                        <option value="kwara">Kwara</option>
                                </select>
                        </p>
                        <button type="submit">Submit</button>
                </form>
                <p id="form-message" role="status" aria-live="polite"></p>
                <nav aria-label="Form lesson links">
                        <p><a href="lesson-summary.txt">What I learned</a></p>
                        <p><a href="assignment2.html">Form assignment</a></p>
                        <p><a href="assignment.html">Signup form example</a></p>
                </nav>
        </main>
        <script src="../theme.js" defer></script>
        <script src="form.js" defer></script>
</body>
</html>
