<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../lesson.css">
    <link rel="stylesheet" href="../theme.css">
    <title>Simple Form Practice</title>
</head>
<body>
    <p><a href="index.html">All form lessons</a></p>
    <main>
        <h1>Simple Form Practice</h1>
        <p>This browser-only example shows a confirmation. It does not save or send your information.</p>
        <form id="signup-form" data-demo-form method="post">
            <p class="form-field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required autocomplete="name">
            </p>
            <p class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
            </p>
            <p class="form-field">
                <label for="password">Password (at least 8 characters)</label>
                <input type="password" id="password" name="password" placeholder="Enter a password" required minlength="8" autocomplete="new-password">
            </p>
            <button type="submit">Submit</button>
        </form>
        <p id="form-message" role="status" aria-live="polite"></p>
    </main>
    <script src="../theme.js" defer></script>
    <script src="form.js" defer></script>
</body>
</html>
